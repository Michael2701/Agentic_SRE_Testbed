name: sre-testbed

x-python-healthcheck: &python-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

# Production-like resource limits for app services. They also make CPU saturation and memory pressure
# faults meaningful (without a quota, a burner on a many-core host changes nothing).
x-app-limits: &app-limits
  cpus: 0.5
  mem_limit: 256m

services:
  nginx:
    image: nginx:1.27-alpine-otel
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - edgeconf:/etc/nginx/runtime:ro
    depends_on:
      gateway:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    <<: *app-limits
    environment:
      <<: *otel-env
      AUTH_URL: http://auth:8000
      ORDER_URL: http://order:8000
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
    depends_on:
      auth:
        condition: service_healthy
      order:
        condition: service_healthy
    healthcheck: *python-healthcheck
    networks: [backend]

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    <<: *app-limits
    environment:
      <<: *otel-env
      REDIS_URL: redis://redis:6379/0
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-3600}
      DEMO_USERS: ${DEMO_USERS:-alice:alice,bob:bob}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck: *python-healthcheck
    networks: [backend]

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    <<: *app-limits
    environment:
      <<: *otel-env
      DATABASE_URL: postgresql://order_svc:order_svc@postgres:5432/${POSTGRES_DB:-orders}
      PAYMENT_URL: http://payment:8000
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}  # sized for ~10 rps with slow writes; 37 non-superuser slots
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      payment:
        condition: service_healthy
    healthcheck: *python-healthcheck
    networks: [backend]

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    <<: *app-limits
    environment:
      <<: *otel-env
    healthcheck: *python-healthcheck
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    # Small enough that connection exhaustion is practical; 3 slots stay reserved for superusers.
    command: ["postgres", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # One-shot, idempotent migrations (schema + roles) on every `make up`, also on an existing volume.
  db-migrate:
    image: postgres:16-alpine
    command: ["sh", "-c", "for f in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f $$f || exit 1; done"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-app}
      PGDATABASE: ${POSTGRES_DB:-orders}
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # --- Control plane (M4) — invisible to the diagnostic plane -----------------
  # Not scraped by Prometheus, not traced, and its logs are dropped by Alloy.

  fault-injector:
    build: ./services/fault-injector
    ports:
      - "127.0.0.1:${FAULT_INJECTOR_PORT:-8090}:8000"
    environment:
      COMPOSE_PROJECT: sre-testbed
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-orders}
      REPORTING_DATABASE_URL: postgresql://reporting:reporting@postgres:5432/${POSTGRES_DB:-orders}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - faultdata:/data
      - edgeconf:/edge
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck: *python-healthcheck
    networks: [backend]

  # Experiments (M7): scenario runs with traffic and hidden ground truth. Control plane as well; it only
  # touches the system through the fault-injector API and the public nginx entry point.
  experiment-runner:
    build: ./services/experiment-runner
    ports:
      - "127.0.0.1:${EXPERIMENT_RUNNER_PORT:-8091}:8000"
    environment:
      FAULT_INJECTOR_URL: http://fault-injector:8000
      BASE_URL: http://nginx
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - experimentdata:/data
      - ./experiments/scenarios:/scenarios:ro
    depends_on:
      fault-injector:
        condition: service_healthy
      nginx:
        condition: service_healthy
    healthcheck: *python-healthcheck
    networks: [backend]

  # --- Observability (M2) ---------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver   # Tempo metrics-generator (service graph, span metrics)
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
    networks: [backend]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
    networks: [backend]

  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [backend]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-orders}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

  # --- Tests & load (profile: test) -------------------------------------------

  tests:
    build: ./tests
    profiles: [test]
    environment:
      BASE_URL: http://nginx
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      GRAFANA_URL: http://grafana:3000
      TEMPO_URL: http://tempo:3200
      FAULT_INJECTOR_URL: http://fault-injector:8000
      EXPERIMENT_RUNNER_URL: http://experiment-runner:8000
    depends_on:
      nginx:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
      fault-injector:
        condition: service_healthy
      experiment-runner:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  faultdata:
  experimentdata:
  edgeconf:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observability"
version = "0.1.0"
description = "Shared telemetry for testbed services: JSON logs, request IDs, Prometheus metrics"
requires-python = ">=3.12"
dependencies = ["prometheus-client==0.21.1"]

[project.optional-dependencies]
http = ["httpx==0.28.1"]

[tool.setuptools]
packages = ["observability"]

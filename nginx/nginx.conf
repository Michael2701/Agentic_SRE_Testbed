load_module modules/ngx_otel_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Keep a client-supplied X-Request-ID, otherwise use nginx's generated one.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Tracing: nginx is the root span of every request and propagates W3C traceparent upstream.
    otel_exporter {
        endpoint tempo:4317;
    }
    otel_service_name nginx;
    otel_trace on;

    # Low-cardinality span names (IDs collapsed), mirroring the FastAPI route templates.
    map $uri $otel_route {
        ~^/orders/[^/]+$ "/orders/{order_id}";
        default          $uri;
    }

    log_format json escape=json
        '{"ts":"$time_iso8601","level":"info","service":"nginx","msg":"request",'
        '"request_id":"$req_id","trace_id":"$otel_trace_id","method":"$request_method","path":"$uri",'
        '"status":$status,"request_time_s":$request_time,"upstream_time_s":"$upstream_response_time",'
        '"bytes_sent":$body_bytes_sent,"remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json;

    # Re-resolve via Docker DNS so a recreated gateway (new IP) is picked up without an nginx restart.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream gateway {
        zone gateway 64k;
        server gateway:8000 resolve;
    }

    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            otel_trace off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location / {
            otel_trace_context propagate;
            otel_span_name "$request_method $otel_route";
            add_header X-Trace-ID $otel_trace_id always;

            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    # Internal only (not published): scraped by nginx-exporter.
    server {
        listen 8081;
        access_log off;
        otel_trace off;

        location = /stub_status {
            stub_status;
        }
    }
}

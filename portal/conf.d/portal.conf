# Portal: one address for every tool (http://localhost:${PORTAL_PORT:-8000}), paths instead of ports.
#
# Control plane, like the injector and the runner: no access log, not traced, not scraped, and Alloy drops its
# container. It is deliberately NOT the app's nginx (:8080), whose logs and traces are diagnostic evidence.
#
# Upstreams are resolved per request (Docker DNS + variables), so the portal starts and keeps working while
# any of them is down or recreated by a fault; each prefix is stripped before proxying.

resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {  # Grafana Live (websocket)
    default upgrade;
    ""      close;
}

server {
    listen 80;
    access_log off;
    absolute_redirect off;  # keep the host's port (the published one, not 80) in redirects

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1800s;  # `wait=true` experiments block until done

    # Control Center: a static single-page app (no build step; Preact + htm and uPlot vendored in ui/vendor).
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /ui/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";  # always revalidate: edits show up on reload
    }

    location = /portal-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Grafana and Prometheus build their links with the prefix (root_url / --web.external-url) but serve
    # from the root, so their in-network address (grafana:3000, prometheus:9090) stays the same.
    location /grafana/ {
        set $upstream grafana:3000;
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /prometheus/ {
        set $upstream prometheus:9090;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # FastAPI services read X-Forwarded-Prefix as their root_path, so Swagger UI works under the prefix.
    location /faults/ {
        set $upstream fault-injector:8000;
        rewrite ^/faults/(.*)$ /$1 break;
        proxy_set_header X-Forwarded-Prefix /faults;
        proxy_pass http://$upstream;
    }

    location /experiments/ {
        set $upstream experiment-runner:8000;
        rewrite ^/experiments/(.*)$ /$1 break;
        proxy_set_header X-Forwarded-Prefix /experiments;
        proxy_pass http://$upstream;
    }

    # The app through its own public entry point (requests show up there as ordinary client traffic).
    location /app/ {
        set $upstream nginx:80;
        rewrite ^/app/(.*)$ /$1 break;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_pass http://$upstream;
    }

    location = /grafana     { return 301 /grafana/; }
    location = /prometheus  { return 301 /prometheus/; }
    location = /faults      { return 301 /faults/docs; }
    location = /experiments { return 301 /experiments/docs; }
    location = /app         { return 301 /app/docs; }
}
